name: 'Caching HTTP proxy report'
description: >
  Stop the caching HTTP proxy, report what it did, and save the cache if this
  run added anything to it.  Run with "if: always()" so the counts are
  reported even when the job failed.

inputs:
  fail-on-blocked:
    description: >
      Fail if the cache refused any request in strict mode.  A refusal already
      gives the client a 504, which normally fails whatever wanted the file --
      but not if that download is tolerated or wrapped in continue-on-error,
      and then strict mode's guarantee is violated in a green run.  This makes
      the refusal itself the failure.
    required: false
    default: 'true'
  assert-used:
    description: >
      Fail if the proxy served no requests at all.  A cache that is never
      consulted looks exactly like a cache that works, so a job that means to
      depend on it should assert that it did.
    required: false
    default: 'false'
  state-dir:
    description: 'Overrides the state directory; defaults to the started one.'
    required: false
    default: ''
  cache-key:
    description: 'Overrides the cache key prefix; defaults to the started one.'
    required: false
    default: ''

outputs:
  hits:
    description: 'Requests served from the cache.'
    value: ${{ steps.stop.outputs.hits }}
  stored:
    description: 'Responses newly added to the cache.'
    value: ${{ steps.stop.outputs.stored }}
  blocked:
    description: 'Requests refused because the cache was in strict mode.'
    value: ${{ steps.stop.outputs.blocked }}

runs:
  using: composite
  steps:
    - name: Stop the proxy and read its counts
      id: stop
      shell: bash
      env:
        STATE_INPUT: ${{ inputs.state-dir }}
        KEY_INPUT: ${{ inputs.cache-key }}
        ASSERT_USED: ${{ inputs.assert-used }}
        FAIL_ON_BLOCKED: ${{ inputs.fail-on-blocked }}
        FOREIGN_PR: >-
          ${{ github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name
                 != github.repository }}
      run: |
        set -eu
        # Clear the proxy settings before stopping the proxy: $GITHUB_ENV
        # applies to later steps, so anything after this connects directly
        # rather than dialling a listener that is gone.  The CA variables can
        # stay; they name the system bundle plus our certificate.
        if [ -n "${GITHUB_ENV:-}" ]; then
          for var in http_proxy https_proxy HTTP_PROXY HTTPS_PROXY \
                     no_proxy NO_PROXY; do
            echo "$var=" >> "$GITHUB_ENV"
          done
        fi

        state="${STATE_INPUT:-${HTTP_CACHE_STATE:-}}"
        if [ -z "$state" ]; then
          echo "::notice::no http cache was started, nothing to report"
          for name in hits stored blocked should-save; do
            echo "$name=" >> "$GITHUB_OUTPUT"
          done
          exit 0
        fi
        bash "${HTTP_CACHE_ACTION_PATH:?}/http_cache.sh" stop || true

        stats="$state/stats.json"
        if [ ! -r "$stats" ]; then
          echo "::warning::the proxy wrote no stats to $stats"
          echo "::group::proxy log"
          tail -50 "$state/mitmdump.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "should-save=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        read_stat() {
          python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2], 0))" \
            "$stats" "$1"
        }
        hits="$(read_stat hit)"
        stored="$(read_stat stored)"
        blocked="$(read_stat blocked)"
        errors="$(read_stat error)"
        forwarded="$(read_stat forwarded)"
        mode="$(read_stat mode)"

        {
          echo "hits=$hits"
          echo "stored=$stored"
          echo "blocked=$blocked"
        } >> "$GITHUB_OUTPUT"

        # Three reasons not to upload, checked before the work of folding
        # the cache in and deleting the entry, so a job that will not upload
        # does none of it.
        #
        # A pull request from another repository is the one worth spelling
        # out.  It cannot replace an entry -- deleting one needs actions:write
        # on GITHUB_TOKEN, which GitHub makes read-only there -- but it can
        # create one, because uploading goes through the cache service on
        # ACTIONS_RUNTIME_TOKEN, which every job has.  That is not worth
        # doing: the entry it creates is scoped to refs/pull/N/merge, so no
        # other pull request and not the default branch can read it, it holds
        # whatever that one job happened to download, and nothing can ever
        # improve it.  The default branch is the writer, on its own pushes and
        # on the schedule in the refresh workflow, and every pull request
        # reads what it leaves.
        reason=''
        if [ "$mode" != "record" ]; then
          reason="no upload, mode is $mode"
        elif [ "$FOREIGN_PR" = "true" ]; then
          reason="no upload, a pull request from another repository cannot"
          reason="$reason replace the entry and the one it could create is"
          reason="$reason readable only by itself"
        elif [ "$((hits + stored + forwarded + blocked))" -eq 0 ]; then
          # Distinct from an all-hit job, and the more interesting of the
          # two: nothing in this job was routed through the proxy at all,
          # which is what a client that ignores http_proxy looks like.
          reason="no upload, nothing was requested through the proxy"
        elif [ "$stored" -eq 0 ]; then
          reason="no upload, everything asked for was already cached"
        fi
        if [ -n "$reason" ]; then
          echo "should-save=false" >> "$GITHUB_OUTPUT"
        else
          echo "should-save=true" >> "$GITHUB_OUTPUT"
        fi
        key="${KEY_INPUT:-${HTTP_CACHE_KEY:-http-cache}}"
        echo "cache-key=$key" >> "$GITHUB_OUTPUT"
        echo "cache-path=$state/cache" >> "$GITHUB_OUTPUT"

        # A one-line count in the run's annotations, which read without a
        # token: the step summary and the log need one, so this is the only
        # place the hit rate can be compared across runs from outside.
        echo "::notice::http cache ($mode): $hits hit, $stored stored,"\
             "$forwarded forwarded, $blocked blocked, $errors error;"\
             "${reason:-uploading}"

        # Every request by name and disposition, not just the counts.
        echo "::group::HTTP cache: every request ($mode mode)"
        python3 "${{ github.action_path }}/render_summary.py" \
            "$state/events.jsonl" "$mode" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "::endgroup::"

        failed=0
        if [ "$blocked" -gt 0 ]; then
          echo "::error::$blocked request(s) were refused because they are not"\
               "in the cache. Label this pull request 'ci-http-cache-record'"\
               "to let it populate the cache, or run the cache-refresh"\
               "workflow on the default branch."
          [ "$FAIL_ON_BLOCKED" = "true" ] && failed=1
        fi
        if [ "$ASSERT_USED" = "true" ] \
           && [ "$((hits + stored + blocked + forwarded))" -eq 0 ]; then
          echo "::error::the http cache proxy served no requests at all, so"\
               "nothing in this job was routed through it"
          failed=1
        fi
        exit "$failed"

    # Fold in whatever the cache gained while this job was running, so the
    # upload below is a superset of the entry it replaces instead of a
    # substitute for it.  Without this the saves are last-writer-wins: each
    # job uploads the cache it restored at the start plus its own downloads,
    # so whichever job finishes last discards every other job's contribution
    # and the cache grows by one job per run.
    #
    # The restore has to name the same path as the save.  A cache action
    # derives an entry's identity from the sha256 of its path list, so a
    # restore into a scratch directory would look for an entry that does not
    # exist and miss every time.  Unpacking over our own state directory is
    # safe because the store is content addressed -- one directory per sha256
    # of the method and URL, holding a body and its metadata, with no index --
    # so an entry both copies hold is overwritten with itself and entries
    # only one holds sit side by side.
    #
    # This narrows the race rather than closing it: a job that saves between
    # this restore and the upload below still loses its downloads, and the
    # next run collects them again.  The cache API has no compare-and-swap,
    # so rarer is the best available.
    - name: Fold in what the cache gained while this job ran
      id: fold
      if: steps.stop.outputs.should-save == 'true'
      continue-on-error: true
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        key: ${{ steps.stop.outputs.cache-key }}
        path: ${{ steps.stop.outputs.cache-path }}

    # A cache action cannot overwrite a key, so an entry that is in the way
    # has to be deleted first -- and only then.  Whether one is in the way is
    # exactly what the restore above reports: its cache-hit is true only for
    # an entry matching this key AND the version that a save would compute
    # from the path, which is the pair that collides.  Asking the REST API
    # instead would mean reimplementing that version hash, and would see the
    # entries left at other paths as collisions when they are not.
    #
    # Only "true" means in the way.  A restore that found nothing leaves
    # cache-hit empty rather than false, so testing for false tests nothing --
    # and a restore can also fail outright, which is not a miss: another job
    # deleting the entry mid-download gives "the specified blob does not
    # exist".  Its outcome tells the two apart, and where the restore failed
    # the upload goes ahead, since a conflict costs a warning while a skipped
    # upload can cost the cache its only chance to exist.
    #
    # Deleting and saving use different credentials.  The REST API below takes
    # GITHUB_TOKEN, which needs actions:write and is read-only on a pull
    # request from a fork; the save takes ACTIONS_RUNTIME_TOKEN, which every
    # job has.  So the three cases are distinct:
    #
    #   nothing in the way   -> upload, no delete.  This is how a cache first
    #                           appears, and it works on a fork's pull request
    #                           even though nothing there can replace an entry.
    #   in the way, deleted  -> upload, which now replaces it.
    #   in the way, kept     -> skip the upload.  It could only conflict, and
    #                           a run has as many of those warnings as it has
    #                           jobs.  A pull request on a branch of the
    #                           repository itself lands here only if the
    #                           repository withholds actions:write.
    - name: Make room for the new cache
      id: room
      if: steps.stop.outputs.should-save == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: ${{ steps.stop.outputs.cache-key }}
        IN_THE_WAY: ${{ steps.fold.outputs.cache-hit }}
        FOLD_RAN: ${{ steps.fold.outcome }}
      run: |
        set -u
        if [ "$FOLD_RAN" = "success" ] && [ "$IN_THE_WAY" != "true" ]; then
          echo "nothing named ${KEY} is in the way, so the upload creates it"
          echo "upload=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if err="$(gh api --method DELETE \
                    "/repos/${GITHUB_REPOSITORY}/actions/caches?key=${KEY}" \
                    2>&1 >/dev/null)"; then
          echo "replaced the previous ${KEY} entry"
          echo "upload=true" >> "$GITHUB_OUTPUT"
        elif printf '%s' "$err" | grep -qiE 'HTTP 404|not found'; then
          echo "the ${KEY} entry went away before it could be deleted"
          echo "upload=true" >> "$GITHUB_OUTPUT"
        elif [ "$FOLD_RAN" != "success" ]; then
          echo "::notice::could not delete the ${KEY} entry, and the restore"\
               "that would say whether one is in the way did not finish, so"\
               "the upload runs and may report a conflict. Delete says:"\
               "${err}"
          echo "upload=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::keeping the existing ${KEY} entry and skipping the"\
               "upload, which could only conflict with it. GITHUB_TOKEN needs"\
               "actions:write to replace an entry and is read-only on a pull"\
               "request from a fork. Delete says: ${err}"
          echo "upload=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the download cache
      if: steps.room.outputs.upload == 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        key: ${{ steps.stop.outputs.cache-key }}
        path: ${{ steps.stop.outputs.cache-path }}
