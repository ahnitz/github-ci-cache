name: 'Caching HTTP proxy'
description: >
  Start a userspace caching HTTP proxy for the rest of the job, so that data
  files downloaded by tests come from a cache instead of the network.  Needs no
  changes to the code doing the downloading.

inputs:
  hosts:
    description: >
      Optional.  Restrict caching to these hosts, each optionally followed by
      a path prefix.  Empty (the default) caches anything that is not on the
      built-in deny list -- the package registries, the GitHub API and Actions
      services, and the git smart-HTTP endpoints -- none of which is specific
      to any project.  Set this only to narrow that deliberately: a list of
      hosts to cache has to be kept in step with the tests by hand, and does
      nothing at all when a host is forgotten.
    required: false
    default: ''
  mode:
    description: >
      "record" fetches and stores on a miss.  "strict" fails a miss with a 504,
      so the job cannot be broken by an upstream outage.  "off" starts no proxy.
      "auto" (the default) is strict on pull requests and record everywhere
      else, which keeps pull requests hermetic and lets the default branch and
      scheduled runs populate the cache.
    required: false
    default: 'auto'
  record-label:
    description: >
      Pull request label that switches "auto" from strict to record.  Without
      an escape hatch a pull request that adds a new download can never pass,
      because the data it needs only enters the cache once it has merged.
    required: false
    default: 'ci-http-cache-record'
  cache-key:
    description: >
      Name of the cache entry, used verbatim.  There is exactly one entry and
      nothing is appended to this, so the cache cannot accumulate versions.
    required: false
    default: 'http-cache'
  state-dir:
    description: >
      Where the cache and the proxy files live.  Defaults to
      ~/.cache/github-ci-cache.  Keep it identical everywhere the cache is
      restored, saved or refreshed: a cache action hashes the path into the
      cache's identity.
    required: false
    default: ''
  port:
    description: 'Port the proxy listens on, on 127.0.0.1.'
    required: false
    default: '3128'
  no-proxy:
    description: >
      Comma-separated hosts kept off the proxy entirely.  Defaults to the
      package ecosystems and the GitHub API: they carry their own caches, and
      keeping them away from a process that terminates TLS keeps a job's token
      out of it.
    required: false
    default: ''
  mitmproxy-version:
    description: 'Version of mitmproxy to install. Pinned so runs match.'
    required: false
    default: '12.2.3'
  minimum-python:
    description: >
      Lowest python the proxy will run under.  Must match the
      requires-python of the pinned mitmproxy (12.x needs 3.12).  The action
      looks for a suitable interpreter itself rather than using the job's
      python3, which belongs to the project's test matrix and may be older.
    required: false
    default: '3.12'

outputs:
  mode:
    description: 'The mode actually used, once "auto" has been resolved.'
    value: ${{ steps.resolve.outputs.mode }}
  state-dir:
    description: 'Where the cache and the proxy files ended up.'
    value: ${{ steps.resolve.outputs.state-dir }}
  cache-hit:
    description: 'Whether a previous cache was restored for this job.'
    value: ${{ steps.restore.outputs.cache-matched-key != '' }}

runs:
  using: composite
  steps:
    - name: Resolve the mode and paths
      id: resolve
      shell: bash
      env:
        REQUESTED_MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        HAS_RECORD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, inputs.record-label) }}
        STATE_DIR: ${{ inputs.state-dir }}
        KEY_PREFIX: ${{ inputs.cache-key }}
      run: |
        set -eu
        case "$REQUESTED_MODE" in
          record|strict|off)
            mode="$REQUESTED_MODE"
            ;;
          auto)
            if [ "$EVENT_NAME" = "pull_request" ] \
               && [ "$HAS_RECORD_LABEL" != "true" ]; then
              mode=strict
            else
              mode=record
            fi
            ;;
          *)
            echo "::error::unknown mode '$REQUESTED_MODE'"
            exit 1
            ;;
        esac
        # Under $HOME, not the runner temp directory: a cache action hashes
        # the path into the cache's identity, so a path that varies by runner
        # or OS splits one cache into several.
        state="${STATE_DIR:-$HOME/.cache/github-ci-cache}"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "state-dir=$state" >> "$GITHUB_OUTPUT"
        echo "cache-key=${KEY_PREFIX}" >> "$GITHUB_OUTPUT"
        echo "http cache mode: $mode (requested $REQUESTED_MODE, event $EVENT_NAME)"

    # Restore only.  Saving happens in the report action, and only when
    # something new was actually stored, so an unchanged cache is not
    # re-uploaded on every run.
    # One entry, one constant name, and an exact key with no restore-keys so
    # that a miss is unambiguous rather than landing on a partial copy.
    - name: Restore the download cache
      id: restore
      if: steps.resolve.outputs.mode != 'off'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        key: ${{ steps.resolve.outputs.cache-key }}
        path: ${{ steps.resolve.outputs.state-dir }}/cache

    - name: Install mitmproxy
      id: install
      if: steps.resolve.outputs.mode != 'off'
      shell: bash
      env:
        STATE: ${{ steps.resolve.outputs.state-dir }}
        VERSION: ${{ inputs.mitmproxy-version }}
        MIN_PYTHON: ${{ inputs.minimum-python }}
      run: |
        set -eu
        # Not whichever python3 the job has: mitmproxy needs 3.12, and the
        # job's interpreter belongs to the project's test matrix.
        found=""
        for candidate in python3.14 python3.13 python3.12 /usr/bin/python3 python3; do
          command -v "$candidate" >/dev/null 2>&1 || continue
          if "$candidate" -c "import sys; raise SystemExit(0 if sys.version_info >= tuple(int(p) for p in '$MIN_PYTHON'.split('.')) else 1)" 2>/dev/null; then
            found="$candidate"
            break
          fi
        done
        if [ -z "$found" ]; then
          echo "::warning::found no python >= $MIN_PYTHON to run mitmproxy $VERSION"
          echo "started=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "running the proxy under $found ($("$found" --version 2>&1))"
        # Its own virtual environment, so the project's environment is untouched.
        "$found" -m venv "$STATE/venv"
        "$STATE/venv/bin/pip" install --quiet --upgrade pip
        "$STATE/venv/bin/pip" install --quiet "mitmproxy==$VERSION" certifi
        echo "started=true" >> "$GITHUB_OUTPUT"

    - name: Start the proxy
      if: steps.resolve.outputs.mode != 'off'
      shell: bash
      env:
        HTTP_CACHE_MODE: ${{ steps.resolve.outputs.mode }}
        HTTP_CACHE_STATE: ${{ steps.resolve.outputs.state-dir }}
        HTTP_CACHE_HOSTS: ${{ inputs.hosts }}
        HTTP_CACHE_NO_PROXY: ${{ inputs.no-proxy }}
        HTTP_CACHE_PORT: ${{ inputs.port }}
      run: |
        set -eu
        state="${{ steps.resolve.outputs.state-dir }}"
        export HTTP_CACHE_MITMDUMP="$state/venv/bin/mitmdump"
        export HTTP_CACHE_SYSTEM_CA="$("$state/venv/bin/python" -c 'import certifi; print(certifi.where())')"
        # The script appends the client settings to $GITHUB_ENV itself, so the
        # rest of the job picks them up; stdout is only for local `eval` use.
        # Fatal only in strict mode, where there is nothing safe to fall back
        # to.  In record mode the fall-back is what the job did before this
        # action existed, so warn and carry on.
        if [ "${{ steps.install.outputs.started }}" != "true" ] \
           || ! bash "${{ github.action_path }}/http_cache.sh" start > /dev/null; then
          if [ "${{ steps.resolve.outputs.mode }}" = "strict" ]; then
            echo "::error::the download cache could not start, and strict mode"\
                 "cannot fall back to the network"
            exit 1
          fi
          echo "::warning::the download cache could not start; this job will"\
               "download directly, as it did before the cache existed"
          exit 0
        fi
        # The report action needs these, and reading them from the environment
        # keeps the caller from having to repeat them.
        echo "HTTP_CACHE_KEY=${{ steps.resolve.outputs.cache-key }}" >> "$GITHUB_ENV"
        echo "HTTP_CACHE_ACTION_PATH=${{ github.action_path }}" >> "$GITHUB_ENV"
